input {
    file {
        path => "/root/data/Clickup_Tasks.csv"
        start_position => beginning
        ignore_older => 86400000
    }
}
filter {
    csv {
        separator => ","
        skip_header => "true"
        columns => ["ID", "Date", "Task ID", "Task Name", "Time Estimate", "Time Tracked", "Open Date", "Close Date", "Status", "Assignee", "Team", "List", "Sprint Start Date", "Sprint End Date", "Subject"]
        convert => {
            "ID" => "integer"
            "Time Estimate" => "float"
            "Time Tracked" => "float"
        }
    }
    date {
        match => ["Date", "dd/MM/yyyy"]
        target => "Date"
    }
    date {
        match => ["Open Date", "dd/MM/yyyy"]
        target => "Open Date"
    }
    date {
        match => ["Close Date", "dd/MM/yyyy"]
        target => "Close Date"
    }
    date {
        match => ["Sprint Start Date", "dd/MM/yyyy"]
        target => "Sprint Start Date"
    }
    date {
        match => ["Sprint End Date", "dd/MM/yyyy"]
        target => "Sprint End Date"
    }
}
output {
    elasticsearch {
        hosts => "127.0.0.1:9200"
        index => "clickup_tasks"
        document_id => 1wn8r6t
        action => "update"
        doc_as_upsert => true
    }
    stdout { codec => rubydebug }
}
